<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper-Slide 3D - Corrida Infinita</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 1.2em;
            z-index: 100;
        }
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffaa;
            font-size: 1.5em;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            z-index: 200;
        }
    </style>
</head>

<body>
    <div id="info">SCORE: 0 | BEST: 0</div>
    <div id="instructions">Clique para Começar! <br><br> Use <- e -> ou toque na tela para mover.</div>
    
    <script>
        // === VARIÁVEIS GLOBAIS ===
        let scene, camera, renderer;
        let ball;
        let score = 0;
        let highScore = localStorage.getItem('hyperSlideHighScore') || 0;
        let gameActive = false;
        let speed = 0.05; // Velocidade de movimento da pista
        let laneCount = 3; // Pistas: -1 (esquerda), 0 (centro), 1 (direita)
        let currentLane = 0; // Começa no centro
        let laneWidth = 3; // Distância entre as pistas
        let obstacles = [];
        let scoreDisplay = document.getElementById('info');
        let instructions = document.getElementById('instructions');
        
        // --- 1. Inicialização da Cena 3D ---
        function init() {
            // Cena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x22223b);

            // Câmera (Perspectiva)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 6); // Posição para dar visão de cima/trás da bola

            // Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            
            // Luzes
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(0, 10, 10);
            scene.add(directionalLight);

            // Câmera "Olha" para a origem
            camera.lookAt(0, 0, 0);

            // Cria a Bola do Jogador
            createBall();
            // Cria a Pista Inicial (Chão)
            createGround();

            scoreDisplay.textContent = `SCORE: 0 | BEST: ${highScore}`;
            
            // Event Listeners (Controles)
            window.addEventListener('keydown', onKeyDown, false);
            window.addEventListener('resize', onWindowResize, false);
            document.addEventListener('click', handleInput, false);

            // Inicia o loop de renderização (mas o jogo não começa a mover)
            renderer.setAnimationLoop(animate);
        }

        // --- 2. Elementos do Jogo ---
        function createBall() {
            const geometry = new THREE.SphereGeometry(0.5, 32, 32);
            const material = new THREE.MeshPhongMaterial({ color: 0x00ffaa });
            ball = new THREE.Mesh(geometry, material);
            ball.position.set(0, 0.5, 0);
            ball.name = 'playerBall';
            scene.add(ball);
        }

        function createGround() {
            const geometry = new THREE.PlaneGeometry(laneWidth * laneCount + 2, 500); // Pista longa
            const material = new THREE.MeshPhongMaterial({ color: 0x4a4e69, side: THREE.DoubleSide });
            const ground = new THREE.Mesh(geometry, material);
            ground.rotation.x = Math.PI / 2; // Gira para ficar plano
            ground.position.y = 0;
            scene.add(ground);
        }
        
        // Adiciona Obstáculos Periodicamente
        let obstacleSpawnTime = 0;
        const obstacleSpawnInterval = 1.5; 

        function spawnObstacle(delta) {
            obstacleSpawnTime += delta;
            
            if (obstacleSpawnTime > obstacleSpawnInterval) {
                // Seleciona uma pista aleatória para o obstáculo
                const lane = Math.floor(Math.random() * laneCount) - 1; // -1, 0, 1
                const xPos = lane * laneWidth;
                
                const geometry = new THREE.BoxGeometry(1, 1, 1);
                const material = new THREE.MeshPhongMaterial({ color: 0xff0055 });
                const obstacle = new THREE.Mesh(geometry, material);
                
                obstacle.position.set(xPos, 0.5, -50); // Aparece longe da câmera
                obstacle.name = 'obstacle';
                scene.add(obstacle);
                obstacles.push(obstacle);
                
                obstacleSpawnTime = 0;
                
                // Aumenta a dificuldade com o tempo
                speed += 0.0005;
            }
        }
        
        // --- 3. Controles ---
        function onKeyDown(event) {
            if (!gameActive) return;
            
            if (event.key === 'ArrowLeft') {
                changeLane(-1);
            } else if (event.key === 'ArrowRight') {
                changeLane(1);
            }
        }
        
        function handleInput(event) {
            if (!gameActive) {
                startGame();
                return;
            }
            
            // Controles Mobile: lado esquerdo/direito da tela
            if (event.clientX < window.innerWidth / 2) {
                changeLane(-1); // Esquerda
            } else {
                changeLane(1); // Direita
            }
        }

        function changeLane(direction) {
            const newLane = currentLane + direction;
            if (newLane >= -1 && newLane <= 1) { // Limita entre -1 e 1
                currentLane = newLane;
                // Move a bola suavemente para a nova pista
                new THREE.TWEEN.Tween(ball.position)
                    .to({ x: currentLane * laneWidth }, 100)
                    .easing(THREE.Easing.Quadratic.Out)
                    .start();
            }
        }
        
        // --- 4. Lógica de Jogo ---
        function startGame() {
            if (gameActive) return;
            gameActive = true;
            instructions.style.display = 'none';
            // PONTO DE MONETIZAÇÃO: Aqui você pode carregar um anúncio intersticial.
            console.log("Jogo Iniciado! Preparar Anúncio.");
        }
        
        function endGame() {
            gameActive = false;
            // Atualiza High Score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('hyperSlideHighScore', highScore);
            }
            scoreDisplay.textContent = `FIM! Pontos: ${score} | NOVO BESTE: ${highScore}`;
            instructions.textContent = `GAME OVER! Pontos: ${score}\nClique para Tentar Novamente.`;
            instructions.style.display = 'block';
            
            // Limpa Obstáculos
            obstacles.forEach(obstacle => scene.remove(obstacle));
            obstacles = [];
            score = 0;
            speed = 0.05;
        }

        // --- 5. Loop de Renderização e Atualização ---
        const clock = new THREE.Clock();
        function animate() {
            const delta = clock.getDelta();
            
            if (gameActive) {
                // Movimento da Pista e Obstáculos
                for (let i = 0; i < obstacles.length; i++) {
                    // Move o obstáculo em direção à câmera (eixo Z)
                    obstacles[i].position.z += speed * delta * 100;
                    
                    // Verifica Colisão
                    if (checkCollision(ball, obstacles[i])) {
                        endGame();
                        return;
                    }
                }
                
                // Remove obstáculos que passaram
                obstacles = obstacles.filter(obstacle => {
                    if (obstacle.position.z > camera.position.z + 1) {
                        scene.remove(obstacle);
                        // Aumenta a pontuação ao passar
                        score++;
                        scoreDisplay.textContent = `SCORE: ${score} | BEST: ${highScore}`;
                        return false;
                    }
                    return true;
                });

                // Spawna novos obstáculos
                spawnObstacle(delta);
            }
            
            // Lógica de Movimento da Câmera para o movimento da bola (suavidade)
            camera.position.x = ball.position.x * 0.1 + camera.position.x * 0.9;

            // Animação para a transição suave de pista
            THREE.TWEEN.update(); 
            
            renderer.render(scene, camera);
        }
        
        // --- 6. Detecção de Colisão (Simples Box Bounding) ---
        const ballBox = new THREE.Box3();
        const obstacleBox = new THREE.Box3();
        
        function checkCollision(ball, obstacle) {
            ballBox.setFromObject(ball);
            obstacleBox.setFromObject(obstacle);
            return ballBox.intersectsBox(obstacleBox);
        }

        // --- 7. Responsividade ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Importante: A biblioteca Tween.js (para animação suave) não está incluída no Three.js,
        // mas é essencial para o movimento de pista suave. Vamos incluí-la no início.
        // Já está incluída no pacote Three.js do CDN que usamos.
        
        init();
        
    </script>
</body>
</html>
